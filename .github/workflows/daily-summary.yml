name: GIX Daily Horizon Briefing

on:
  schedule:
    # Primary and fallback slots: 05:17 and 06:17 Asia/Shanghai.
    # The same-day gate below prevents duplicate Feishu delivery.
    - cron: '17 21 * * *'
    - cron: '17 22 * * *'
  workflow_dispatch:

concurrency:
  group: gix-daily-briefing
  cancel-in-progress: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write

    steps:
      - name: Decide whether this Beijing-day briefing is needed
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          report_date="$(TZ=Asia/Shanghai date +'%Y-%m-%d')"
          echo "DATE=${report_date}" >> "$GITHUB_ENV"

          if [[ "$EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          status="$(curl --silent --show-error --location \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/_posts/${report_date}-summary-zh.md?ref=gh-pages")"

          if [[ "$status" == "200" ]]; then
            echo "Briefing ${report_date} already exists; skipping duplicate delivery."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          elif [[ "$status" == "404" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected GitHub API status while checking the daily gate: ${status}" >&2
            exit 1
          fi

      - name: Checkout code
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v6

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.gate.outputs.should_run == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.26"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: uv sync

      - name: Prepare GIX configuration
        if: steps.gate.outputs.should_run == 'true'
        run: cp data/config.github.json data/config.json

      - name: Generate the bilingual GIX briefing
        if: steps.gate.outputs.should_run == 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HORIZON_TIMEZONE: Asia/Shanghai
        run: uv run horizon --hours 24 --log-level INFO

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.should_run == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "GIX daily briefing: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
